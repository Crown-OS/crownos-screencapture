[package]
name = "crownos-screenshot"
version = "0.1.0"
edition = "2024"
description = "Screenshot and screen recording tool for CrownOS and other Wayland desktops"

[lib]
name = "crownos_screenshot"
path = "src/lib.rs"

[[bin]]
name = "crownos-screenshot"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
app = [
  "dep:anyhow",
  "dep:thiserror",
  "dep:clap",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:dirs",
  "dep:chrono",
  "dep:rustix",
  "dep:memmap2",
  "dep:crownui",
  "dep:crownos-config",
  "dep:crownotify",
  "dep:crownos-preview",
  "dep:sctk",
  "dep:wayland-client",
  "dep:wayland-protocols",
  "dep:gbm",
  "dep:png",
  "dep:turbojpeg",
  "dep:ffmpeg-next",
  "dep:pipewire",
  "dep:rtrb",
  "dep:signal-hook",
  "dep:zbus",
]

[dependencies]
anyhow = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
dirs = { version = "6", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
memmap2 = { version = "0.9", optional = true }
rustix = { version = "1", default-features = false, features = ["std", "fs", "mm", "event", "process", "time"], optional = true }

crownui = { path = "../crownui/crownui", default-features = false, features = ["wayland", "impeller", "static"], optional = true }
crownos-ipc = { path = "../crownos-ipc" }
crownos-config = { path = "../crownos-config", default-features = false, optional = true }
crownotify = { path = "../crownotify", default-features = false, optional = true }
crownos-preview = { path = "../crownos-preview", default-features = false, optional = true }

sctk = { package = "smithay-client-toolkit", version = "0.21", default-features = false, optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
gbm = { version = "0.18", default-features = false, optional = true }

png = { version = "0.18", optional = true }
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"], optional = true }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "filter", "format"], optional = true }
pipewire = { version = "0.10.1", optional = true }
rtrb = { version = "0.3.5", optional = true }
signal-hook = { version = "0.3", default-features = false, optional = true }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
